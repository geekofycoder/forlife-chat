    <path d="M232 46C176 42 134 72 128 130C124 168 128 208 138 244C142 204 146 164 158 136C172 106 200 92 230 86Z" fill="url(#vh)"/>
    <path d="M236 46C266 50 284 82 280 134C272 108 258 94 238 88Z" fill="url(#vh)"/>
    <path d="M220 54C184 56 154 78 144 118C160 90 186 72 220 66Z" fill="#5a4136" opacity=".75"/>
