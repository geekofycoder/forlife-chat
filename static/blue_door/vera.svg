    <path d="M181 199Q200 221 219 199Q200 207 181 199Z" fill="#fff8f2"/>
    <path d="M181 199Q200 221 219 199" fill="none" stroke="#9a4038" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M181 199Q200 205 219 199" fill="none" stroke="#9a4038" stroke-width="2.4" stroke-linecap="round"/>
