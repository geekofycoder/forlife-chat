      <stop offset="0" stop-color="#0b6b53"/>
      <stop offset="1" stop-color="#04473a"/>
    </linearGradient>
    <linearGradient id="vh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35261f"/>
      <stop offset="1" stop-color="#1b1310"/>
