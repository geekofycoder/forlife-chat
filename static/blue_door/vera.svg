    <ellipse cx="261" cy="160" rx="9" ry="14" fill="#b97d58"/>
    <circle cx="260" cy="181" r="6" fill="none" stroke="#e2a93b" stroke-width="3"/>
    <!-- face -->
    <path d="M200 70C156 70 140 104 140 150C140 198 164 236 200 238C236 236 260 198 260 150C260 104 244 70 200 70Z" fill="#c68a64"/>
    <path d="M236 92C262 120 264 196 226 230C244 198 250 140 236 92Z" fill="#a96f4d" opacity=".35"/>
    <!-- cheeks -->
    <ellipse cx="167" cy="188" rx="13" ry="8" fill="#e07a63" opacity=".3"/>
    <ellipse cx="233" cy="188" rx="13" ry="8" fill="#e07a63" opacity=".3"/>
    <!-- brows -->
    <path d="M164 134Q177 126 190 131" fill="none" stroke="#2a1c17" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M210 131Q223 126 236 134" fill="none" stroke="#2a1c17" stroke-width="4.5" stroke-linecap="round"/>
    <!-- eyes, with a small lifted outer line -->
    <ellipse cx="178" cy="154" rx="5.5" ry="7" fill="#2a1c17"/>
    <ellipse cx="222" cy="154" rx="5.5" ry="7" fill="#2a1c17"/>
    <circle cx="180" cy="151" r="1.8" fill="#fff"/>
    <circle cx="224" cy="151" r="1.8" fill="#fff"/>
    <path d="M172.5 149L168.5 146.5M227.5 149L231.5 146.5" stroke="#2a1c17" stroke-width="2.4" stroke-linecap="round"/>
